<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 480" width="480" height="480">

<title>Hemlock Hex Logo</title>
<desc>Gothic-cyber animated logo for the Hemlock Hex Discord server.</desc>

<defs>
  <filter id="f-noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.88" numOctaves="3" result="noise">
      <animate attributeName="seed" values="0;3;7;13;19;25;31;37;0" dur="0.65s" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
    <feBlend in="SourceGraphic" in2="gray" mode="screen"/>
  </filter>
  <filter id="f-glow-g" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-glow-p" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-glow-sm" x="-50%" y="-25%" width="200%" height="150%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scanlines" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1" height="1" fill="#000" opacity="0.07"/>
  </pattern>

  <clipPath id="dc0"><rect x="354" y="113" width="13" height="0">
    <animate attributeName="height" values="0;0;0;160;160;0;0"
      keyTimes="0;0.559;0.560;0.650;0.740;0.760;1" dur="5s" repeatCount="indefinite"/>
  </rect></clipPath>
  <clipPath id="dc1"><rect x="358" y="127" width="13" height="0">
    <animate attributeName="height" values="0;0;0;155;155;0;0"
      keyTimes="0;0.571;0.572;0.655;0.742;0.760;1" dur="5s" repeatCount="indefinite"/>
  </rect></clipPath>
  <clipPath id="dc2"><rect x="352" y="140" width="13" height="0">
